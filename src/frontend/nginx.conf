# Auth brute-force rate limit (per client IP). Zone must live in http{} context
# (files under conf.d/ are included there by the nginx alpine image).
limit_req_zone $binary_remote_addr zone=authlimit:10m rate=8r/m;

# HTTP → HTTPS redirect (users who type http:// by mistake)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stricter limit on credential endpoints (complements Redis lockout in the API).
    location = /api/v1/auth/login {
        limit_req zone=authlimit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
        proxy_pass http://app:8000/api/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/first-access {
        limit_req zone=authlimit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_read_timeout 60s;
        proxy_pass http://app:8000/api/v1/auth/first-access;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        # Match backend MAX_FILE_SIZE (500 MB) for evidence uploads.
        client_max_body_size 500m;
        proxy_read_timeout 300s;
        proxy_pass http://app:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://app:8000/health;
    }
}
