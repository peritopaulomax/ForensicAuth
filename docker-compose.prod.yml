# Production compose for ForensicAuth.
# Requires .env.production with secure secrets (SECRET_KEY, CUSTODY_SIGNING_PRIVATE_KEY,
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB).

services:
  db:
    image: postgres:15-alpine
    container_name: forensicauth-db-prod
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: forensicauth-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: forensicauth-app-prod
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    environment:
      - FORENSICAUTH_PROCESS_ROLE=api
      - FORENSICAUTH_WORKER_QUEUE=celery
      - PYTHONPATH=/app/src/backend
      - HOME=/tmp
      - UPLOAD_DIR=/opt/forensicauth/data/uploads
      - RESULTS_DIR=/opt/forensicauth/data/results
      - DERIVATIVES_DIR=/opt/forensicauth/data/derivatives
      - PERITUS_CASES_DIR=/opt/forensicauth/data/peritus_cases
      - REFERENCE_DATA_DIR=/opt/forensicauth/reference_data
      - FORENSICAUTH_REFERENCE_DATA_DIR=/opt/forensicauth/reference_data
    volumes:
      - ./data/uploads:/opt/forensicauth/data/uploads
      - ./data/results:/opt/forensicauth/data/results
      - ./data/derivatives:/opt/forensicauth/data/derivatives
      - ./data/peritus_cases:/opt/forensicauth/data/peritus_cases
      - ./models:/opt/forensicauth/models
      - ./reference_data:/opt/forensicauth/reference_data
      - ./vendor:/opt/forensicauth/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: forensicauth-worker-prod
    user: "1000:1000"
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info -c 4
    env_file:
      - .env.production
    environment:
      - FORENSICAUTH_PROCESS_ROLE=worker-cpu
      - FORENSICAUTH_WORKER_QUEUE=celery
      - GPU_AVAILABLE=false
      - PYTHONPATH=/app/src/backend
      - HOME=/tmp
      - UPLOAD_DIR=/opt/forensicauth/data/uploads
      - RESULTS_DIR=/opt/forensicauth/data/results
      - DERIVATIVES_DIR=/opt/forensicauth/data/derivatives
      - PERITUS_CASES_DIR=/opt/forensicauth/data/peritus_cases
      - REFERENCE_DATA_DIR=/opt/forensicauth/reference_data
      - FORENSICAUTH_REFERENCE_DATA_DIR=/opt/forensicauth/reference_data
    volumes:
      - ./data/uploads:/opt/forensicauth/data/uploads
      - ./data/results:/opt/forensicauth/data/results
      - ./data/derivatives:/opt/forensicauth/data/derivatives
      - ./data/peritus_cases:/opt/forensicauth/data/peritus_cases
      - ./models:/opt/forensicauth/models
      - ./reference_data:/opt/forensicauth/reference_data
      - ./vendor:/opt/forensicauth/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: forensicauth-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
