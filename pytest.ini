[pytest]
# Markers tambem registrados em tests/conftest.py (pytest_configure).
# Default honesto (sem pesos/GPU): ver docs/developer/02-guia-contribuidor.md §11
#   PYTHONPATH=src/backend pytest tests/unit tests/integration -m "not weights and not gpu" -q
# Completo (pesos/GPU):
#   PYTHONPATH=src/backend pytest tests/unit tests/integration -q
# So pesos/GPU:
#   PYTHONPATH=src/backend pytest tests/unit tests/integration -m "weights or gpu" -q

norecursedirs = .git .tox dist build *.egg __pycache__

markers =
    e2e: testes end-to-end simulados
    integration: testes de integracao com pesos/runtime
    e2e_sanitization: fluxo fim-a-fim da sanitizacao (preserva DB de dev)
    weights: exige pesos ML / vendor baixados
    gpu: exige CUDA/GPU real ou smoke GPU
    slow: regressao lenta / compilacao nativa / golden pesado
